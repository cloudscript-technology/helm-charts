apiVersion: v2
name: dumpscript
description: The DumpScript is a unified system for backup and restore of MySQL, PostgreSQL, MongoDB and ClickHouse databases to S3-compatible storage and Azure Blob Storage.
type: application
version: 1.9.0
appVersion: "v0.0.43-alpine-edge"
kubeVersion: ">= 1.27.0-0"
home: https://cloudscript.com.br
icon: https://charts.cloudscript.com.br/helm-charts/dumpscript/cloudscript-logo.png
keywords:
  - kubernetes
  - helm
  - dumpscript
  - cloudscript
  - backup
  - restore
  - mysql
  - postgresql
  - mongodb
  - clickhouse
  - s3
  - azure
  - blob-storage
maintainers:
  - name: Jonathan Schmitt
    email: jonathan.schmitt@cloudscript.com.br
  - name: Helias Rodrigues
    email: helias.rodrigues@cloudscript.com.br
dependencies: []
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: ClickHouse support (`type: clickhouse`) with native server-side `BACKUP ... TO S3()/AzureBlobStorage()` as a single tar archive, no local volume required
    - kind: added
      description: "`databases[].extraEnv` to pass extra environment variables to the job (e.g. CLICKHOUSE_*, S3_STORAGE_CLASS)"
    - kind: fixed
      description: "`databases[].version` is now propagated for `type: mariadb` (MARIADB_VERSION was never set)"
    - kind: fixed
      description: Retention cleanup parsed the object size as the path and never deleted expired backups (image v0.0.43)
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/images: |
    - name: dumpscript alpine3.21
      image: ghcr.io/cloudscript-technology/dumpscript:v0.0.43-alpine-3-21
    - name: dumpscript alpine3.20
      image: ghcr.io/cloudscript-technology/dumpscript:v0.0.43-alpine-3-20
    - name: dumpscript alpine-edge (PostgreSQL 18)
      image: ghcr.io/cloudscript-technology/dumpscript:v0.0.43-alpine-edge
  artifacthub.io/displayName: "Dump Script"
  artifacthub.io/license: "MIT"
  artifacthub.io/provider: "Cloudscript"
  artifacthub.io/links: |
    - name: Cloudscript
      url: https://cloudscript.com.br
    - name: Source
      url: https://github.com/cloudscript-technology/helm-charts
  artifacthub.io/valuesSchema: "https://charts.cloudscript.com.br/dumpscript/1.9.0/values-schema.json"
