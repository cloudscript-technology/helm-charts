# Test values for ServiceAccount identity and token mount
# Global SA named after the release with the token disabled, one component with its own SA,
# and one component opting back into the token at pod level.

serviceAccount:
  create: true
  nameFromRelease: true
  automount: false

apps:
  - name: api
    enabled: true
    type: deployment

    image:
      repository: nginx
      tag: "1.21"
      pullPolicy: IfNotPresent

    replicaCount: 1

    ports:
      - name: http
        containerPort: 80
        protocol: TCP

  - name: worker
    enabled: true
    type: deployment

    image:
      repository: nginx
      tag: "1.21"
      pullPolicy: IfNotPresent

    replicaCount: 1

    serviceAccount:
      create: true
      automount: false

  - name: k8s-client
    enabled: true
    type: deployment

    image:
      repository: nginx
      tag: "1.21"
      pullPolicy: IfNotPresent

    replicaCount: 1

    automountServiceAccountToken: true
