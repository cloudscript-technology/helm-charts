apiVersion: v2
name: opsscript-agent
description: The OpsScript Kubernetes Agent runs inside the client's Kubernetes cluster, collects data from configured integrations (Elasticsearch, Kubernetes, Alertmanager webhooks) and ships it to the OpsScript platform, where alerts and tickets are created automatically.
type: application
version: 1.2.2
appVersion: "v1.1.2"
kubeVersion: ">= 1.27.0-0"
home: https://opsscript.io
icon: https://charts.cloudscript.com.br/helm-charts/opsscript-agent/logo.png
keywords:
  - kubernetes
  - helm
  - agent
  - cloudscript
  - opsscript
  - monitoring
  - alerting
maintainers:
  - name: Jonathan Schmitt
    email: jonathan.schmitt@cloudscript.com.br
  - name: Helias Rodrigues
    email: helias.rodrigues@cloudscript.com.br
dependencies: []
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: "appVersion v1.1.2: integração Elasticsearch aceita CA customizada (PEM) e opção de ignorar a verificação TLS, para clusters com certificado autoassinado (ex.: ECK); configurado no OpsScript, sem mudança de values"
    - kind: security
      description: "appVersion v1.1.2: rebuild com Go 1.26.10, echo v4.16.1 e golang.org/x/net v0.60.0 (corrige GHSA-cxf3-9h37-7rr8 e CVEs HIGH de stdlib/x/net)"
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/images: |
    - name: opsscript-agent
      image: public.ecr.aws/a3g9d1z6/opsscript-agent:v1.1.2
  artifacthub.io/displayName: "OpsScript Kubernetes Agent"
  artifacthub.io/license: "Apache-2.0"
  artifacthub.io/provider: "Cloudscript"
  artifacthub.io/links: |
    - name: OpsScript
      url: https://opsscript.io
    - name: Source
      url: https://github.com/cloudscript-technology/helm-charts
  artifacthub.io/valuesSchema: "https://charts.cloudscript.com.br/helm-charts/opsscript-agent/1.2.2/values.schema.json"
