# Default values for opsscript-agent

# The agent is a stateful singleton: collection checkpoints and cron
# schedules assume a single running instance. Running more than one
# replica duplicates collections and races the checkpoint cursor.
# Do not change unless you know what you are doing.
replicaCount: 1

image:
  # Image repository
  repository: public.ecr.aws/a3g9d1z6/opsscript-agent
  # Image pull policy
  pullPolicy: IfNotPresent
  # Image tag. Default is the chart appVersion
  tag: ""

# Image pull secrets (not needed for the default public registry)
imagePullSecrets: []

# Override the name of the chart
nameOverride: ""

# Override the full name of the chart
fullnameOverride: ""

config:
  # URL of the OpsScript agent server
  agentServerUrl: "https://agent.opsscript.io"
  # ID of the agent, generated when the agent is created in OpsScript
  # (Integrations > Kubernetes Agent). Not required when the AGENT_ID key
  # is provided via credentials.existingSecret.
  agentId: ""
  # Log level: debug | info | warn | error
  logLevel: "info"
  # Initial search window for pull collectors, in seconds (AGENT_SEARCH_INTERVAL)
  searchInterval: 60
  # How often the agent re-fetches its integration list from the server,
  # in seconds. 0 disables hot-reload (AGENT_RELOAD_INTERVAL_SECONDS).
  reloadIntervalSeconds: 60
  # Cluster name (CLUSTER_NAME) reported with the heartbeat and, since agent
  # v1.0.4, used as the authoritative cluster name in the OpsScript inventory.
  # Leave empty to omit the variable and let the agent autodetect a name
  # (POD_NAME/POD_NAMESPACE/NODE_NAME come from the downward API
  # automatically).
  clusterName: ""

credentials:
  # PREFERRED: name of a pre-existing Secret containing the keys
  # AGENT_TOKEN (required) and AGENT_ID (optional, overrides config.agentId).
  # Create it with:
  #   kubectl create secret generic opsscript-agent-credentials \
  #     --from-literal=AGENT_ID=<id> --from-literal=AGENT_TOKEN=<token>
  existingSecret: ""
  # Alternative: pass the token directly and let the chart create the
  # Secret. Convenient for a quick start, but the token ends up in your
  # values/Helm history — avoid in GitOps repositories.
  agentToken: ""

# Graceful shutdown budget. On update the Recreate strategy terminates the
# old pod before starting the new one, so this window must comfortably cover
# the agent's cron drain (AGENT_CRON_STOP_TIMEOUT_SECONDS, default 20s) plus
# the preStop sleep, leaving room for the graceful-shutdown event POST before
# Kubernetes sends SIGKILL. Keep it strictly greater than
# preStop.sleepSeconds + the cron stop timeout.
terminationGracePeriodSeconds: 60

# preStop hook: a short pause before SIGTERM lets in-flight webhook requests
# and Service endpoint updates settle, and widens the shutdown budget.
# Uses the native `sleep` lifecycle action (Kubernetes >= 1.29) because the
# agent image is distroless/static and has no shell to run `sleep` via exec.
lifecycle:
  preStop:
    # Enable the preStop sleep
    enabled: true
    # Seconds to sleep before the container receives SIGTERM. Must be less
    # than terminationGracePeriodSeconds.
    sleepSeconds: 10

# Always-on health endpoints (/healthz and /readyz) used by the probes
health:
  port: 8081

livenessProbe:
  httpGet:
    path: /healthz
    port: health
  initialDelaySeconds: 5
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /readyz
    port: health
  initialDelaySeconds: 5
  periodSeconds: 10

# Push-based integrations (e.g. Alertmanager webhooks)
webhooksServer:
  # Enable the webhook server
  enabled: false
  # Port the webhook server listens on
  port: 8080
  # Path for the Alertmanager endpoint
  alertmanagerPath: "/webhooks/alertmanager"
  service:
    # Type of service
    type: ClusterIP
    # Port for the service
    port: 8080
    # Annotations for the service
    annotations: {}
  ingress:
    # Enable ingress for the webhook server
    enabled: false
    # Ingress class name
    className: ""
    # Annotations for the ingress
    annotations: {}
    # Hostname for the ingress
    hostname: ""
    # Path for the ingress
    path: /
    # TLS configuration, e.g.
    # tls:
    #   - hosts: [alerts.example.com]
    #     secretName: opsscript-agent-tls
    tls: []
  # Gateway API alternative to the ingress (requires the HTTPRoute CRDs
  # and an existing Gateway). Enable one OR the other, not both.
  httpRoute:
    # Enable HTTPRoute for the webhook server
    enabled: false
    # Annotations for the HTTPRoute
    annotations: {}
    # Gateways to attach to, e.g.
    # parentRefs:
    #   - name: eg
    #     namespace: envoy-gateway-system
    parentRefs: []
    # Hostnames matched by the route, e.g. [alerts.example.com]
    hostnames: []
    # Path prefix routed to the webhook server
    path: /

# Extra environment variables for the agent container, e.g. ELASTIC_APM_*
extraEnv: []

# Extra envFrom sources (ConfigMaps/Secrets)
extraEnvFrom: []

serviceAccount:
  # Create a service account
  create: true
  # Automount service account token (required by the Kubernetes collector)
  automount: true
  # Annotations for the service account
  annotations: {}
  # Name of the service account. Defaults to the fullname
  name: ""

rbac:
  # Create the ClusterRole/ClusterRoleBinding used by the Kubernetes
  # collector. Least-privilege: read-only, no access to Secret contents.
  create: true
  # Additional rules appended to the ClusterRole, e.g. to let future
  # collectors read more resources:
  # extraRules:
  #   - apiGroups: ["apps"]
  #     resources: [deployments]
  #     verbs: [get, list]
  extraRules: []

# Alertmanager integration: lets the agent read Prometheus Operator CRs
# cluster-wide, and manage (create/update/patch/delete) PrometheusRule and
# AlertmanagerConfig objects in a single, confined namespace. Disabled by
# default — preserves the read-only promise until a client opts in.
# The agent never reads or writes the Secret backing Alertmanager
# (`alertmanager.yaml`), regardless of this setting.
alertmanagerIntegration:
  # Enable the ClusterRole additions (read monitoring.coreos.com
  # cluster-wide) and the write-scoped Role/RoleBinding below
  enabled: false
  # Namespace where the agent is allowed to create/update/patch/delete
  # PrometheusRule and AlertmanagerConfig objects. This is the only
  # namespace where the agent can write anything.
  targetNamespace: monitoring

# MCP via agent: lets the OpsScript AI reach an MCP server that exists only
# inside this cluster. The platform enqueues the call, this agent executes
# it locally and returns only the result.
#
# Enable this when the MCP server must NOT be exposed to the internet —
# which is the whole reason the feature exists.
mcp:
  # Open the command channel (long-poll against the agent server). Off by
  # default: an agent that never receives commands should not hold a
  # connection open. Turning it on is the client's decision, independent
  # of what is configured on the platform side.
  enabled: false
  # Namespaces where the agent may read MCP tokens, so the credential never
  # leaves this cluster.
  #
  # Namespaces, not Secret names, on purpose: one agent serves MANY MCP
  # servers, each with its own credential, and the set changes whenever
  # someone registers a server in OpsScript. Listing names here would mean a
  # chart deploy for every new MCP — a GitOps PR and a sync to add a
  # credential, which defeats the self-service the UI offers.
  #
  # Empty (default) means the release namespace. Point it at a namespace
  # dedicated to MCP tokens: the grant is `get` only (never list or watch, so
  # the agent cannot enumerate what is there), but within a listed namespace
  # it can read any Secret whose name it is told. Do not list a namespace
  # that also holds unrelated credentials.
  #
  # For a stricter grant (specific Secret names via resourceNames), leave
  # this empty and use rbac.extraRules.
  #
  #   secretNamespaces:
  #     - observability
  secretNamespaces: []
  # How long the agent asks the server to hold an empty poll open, in
  # seconds. Keep it below any idle timeout between the agent and the
  # platform (load balancers commonly default to 60s).
  waitSeconds: 25
  # How many commands the agent executes at once.
  concurrency: 4

# Workload/PVC inventory collector. Off by default (empty allowlist): the
# client decides the blast radius of read access by listing the namespaces
# the agent is allowed to inspect. No Secret access is ever granted.
inventory:
  # Namespaces the agent may read workloads/PVCs from (Role + RoleBinding
  # per namespace listed). Empty list = inventory collection disabled
  # (cluster + nodes inventory, as today, is unaffected).
  namespaces: []
  # Opt-in: grant a cluster-wide ClusterRole instead of per-namespace Roles,
  # ignoring the `namespaces` allowlist above. Use only when the client
  # explicitly wants full-cluster read access.
  clusterWide: false
  # Sampling interval for metrics collection (AGENT_METRICS_INTERVAL).
  # Floor is 1m; lower values are rejected by the agent.
  metricsInterval: "5m"
  # Override the Prometheus URL used by the agent instead of relying on
  # autodiscovery. Leave empty to let the agent autodiscover.
  prometheusUrl: ""

# Annotations for the pod
podAnnotations: {}

# Labels for the pod
podLabels: {}

# Security context for the pod
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# Security context for the container
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Resource requests and limits for the container.
# The agent is lightweight; uncomment and adjust to your cluster policy.
resources: {}
  # requests:
  #   cpu: 50m
  #   memory: 64Mi
  # limits:
  #   memory: 128Mi

# Priority class for the pod
priorityClassName: ""

# Node selector for the pod
nodeSelector: {}

# Tolerations for the pod
tolerations: []

# Affinity rules for the pod
affinity: {}
