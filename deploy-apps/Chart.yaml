apiVersion: v2
name: deploy-apps
description: Helm chart flexível para deploy de múltiplas aplicações (Deployment, StatefulSet, CronJob, Job) com suporte a External Secrets e KEDA
type: application
version: 0.4.1
appVersion: "0.4.1"
kubeVersion: ">= 1.27.0-0"
home: https://cloudscript.com.br
icon: https://charts.cloudscript.com.br/helm-charts/deploy-apps/logo.png
keywords:
  - kubernetes
  - helm
  - multi-app
  - deployment
  - statefulset
  - cronjob
  - job
  - external-secrets
  - keda
  - autoscaling
  - pdb
  - cloudscript
maintainers:
  - name: Jonathan Schmitt
    email: jonathan.schmitt@cloudscript.com.br
dependencies: []
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: apps[].timeZone sets spec.timeZone on CronJobs
    - kind: added
      description: apps[].activeDeadlineSeconds sets activeDeadlineSeconds on the Job spec of Jobs and CronJobs
    - kind: fixed
      description: backoffLimit and ttlSecondsAfterFinished 0 are now rendered on CronJobs; previously 0 was dropped and Kubernetes applied its defaults (6 retries, no TTL)
  artifacthub.io/displayName: "Deploy Apps"
  artifacthub.io/license: "Apache-2.0"
  artifacthub.io/provider: "Cloudscript"
  artifacthub.io/links: |
    - name: Cloudscript
      url: https://cloudscript.com.br
    - name: Documentation
      url: https://github.com/cloudscript-technology/helm-charts/tree/main/deploy-apps
