apiVersion: v2
name: opsscript-agent
description: The OpsScript Kubernetes Agent runs inside the client's Kubernetes cluster, collects data from configured integrations (Elasticsearch, Kubernetes, Alertmanager webhooks) and ships it to the OpsScript platform, where alerts and tickets are created automatically.
type: application
version: 1.2.1
appVersion: "v1.1.1"
kubeVersion: ">= 1.27.0-0"
home: https://opsscript.io
icon: https://charts.cloudscript.com.br/helm-charts/opsscript-agent/logo.png
keywords:
  - kubernetes
  - helm
  - agent
  - cloudscript
  - opsscript
  - monitoring
  - alerting
maintainers:
  - name: Jonathan Schmitt
    email: jonathan.schmitt@cloudscript.com.br
  - name: Helias Rodrigues
    email: helias.rodrigues@cloudscript.com.br
dependencies: []
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: "A permissão de leitura de Secret passa a depender de mcp.secretNamespaces, não de mcp.enabled: em 1.2.0, atualizar concedia get secrets no namespace do release mesmo sem MCP configurado"
    - kind: changed
      description: "appVersion v1.1.1: o MCP via agente exige um agente que anuncie as capabilities command.poll e mcp.call no heartbeat (v1.1.0+), e o modo mcp.enabled=auto exige v1.1.1+ — em v1.1.0 o valor cai em ligado, sem o comportamento ocioso"
    - kind: added
      description: Optional mcp toggle (default off) so the OpsScript AI can reach an MCP server that is only reachable from inside the cluster, without exposing it to the internet
    - kind: added
      description: "mcp.secretRefs grants read on exactly the named Secrets (Role with resourceNames, verb get) so the MCP token never leaves the cluster; no Secret permission is created when the list is empty"
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/images: |
    - name: opsscript-agent
      image: public.ecr.aws/a3g9d1z6/opsscript-agent:v1.1.1
  artifacthub.io/displayName: "OpsScript Kubernetes Agent"
  artifacthub.io/license: "Apache-2.0"
  artifacthub.io/provider: "Cloudscript"
  artifacthub.io/links: |
    - name: OpsScript
      url: https://opsscript.io
    - name: Source
      url: https://github.com/cloudscript-technology/helm-charts
  artifacthub.io/valuesSchema: "https://charts.cloudscript.com.br/helm-charts/opsscript-agent/1.2.1/values.schema.json"
