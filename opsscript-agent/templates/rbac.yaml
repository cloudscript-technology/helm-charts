{{- if .Values.rbac.create -}}
# Least-privilege, read-only access for the Kubernetes collector.
#
# No access to Secret contents anywhere in the cluster, with exactly one
# opt-in exception at the bottom of this file: when mcp.secretRefs is set,
# a Role restricted by resourceNames lets the agent read those specific
# Secrets to authenticate against an in-cluster MCP server. That value is
# used as a request header and never leaves the cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "opsscript-agent.clusterRoleName" . }}
  labels:
    {{- include "opsscript-agent.labels" . | nindent 4 }}
rules:
  # Cluster inventory: node count/versions and cloud-provider detection
  # (labels/providerID on nodes)
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list]
  # Workload inventory
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  # Cluster identification (EKS aws-auth / cluster-info); restricted by
  # name — grants no read on any other ConfigMap
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [aws-auth, cluster-info]
    verbs: [get]
  {{- if .Values.alertmanagerIntegration.enabled }}
  # Alertmanager integration: cluster-wide read of Prometheus Operator CRs
  # (snapshot for suggestions/coverage). Writes are confined to the
  # Role/RoleBinding below, scoped to a single namespace.
  - apiGroups: [monitoring.coreos.com]
    resources: [prometheusrules, alertmanagerconfigs, prometheuses, alertmanagers]
    verbs: [get, list, watch]
  {{- end }}
  {{- with .Values.rbac.extraRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "opsscript-agent.clusterRoleName" . }}
  labels:
    {{- include "opsscript-agent.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "opsscript-agent.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "opsscript-agent.clusterRoleName" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- if and .Values.rbac.create .Values.alertmanagerIntegration.enabled }}
---
# Alertmanager integration: write access confined to a single namespace.
# Never grants access to Secrets (e.g. the alertmanager.yaml config).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "opsscript-agent.alertmanagerRoleName" . }}
  namespace: {{ .Values.alertmanagerIntegration.targetNamespace }}
  labels:
    {{- include "opsscript-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [monitoring.coreos.com]
    resources: [prometheusrules, alertmanagerconfigs]
    verbs: [create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "opsscript-agent.alertmanagerRoleName" . }}
  namespace: {{ .Values.alertmanagerIntegration.targetNamespace }}
  labels:
    {{- include "opsscript-agent.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "opsscript-agent.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "opsscript-agent.alertmanagerRoleName" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- if and .Values.rbac.create (not .Values.inventory.clusterWide) .Values.inventory.namespaces }}
{{- $root := . }}
{{- range .Values.inventory.namespaces }}
---
# Workload/PVC inventory: read access confined to namespaces explicitly
# allowlisted in inventory.namespaces. Never grants access to Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "opsscript-agent.inventoryRoleName" $root }}
  namespace: {{ . }}
  labels:
    {{- include "opsscript-agent.labels" $root | nindent 4 }}
rules:
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods, persistentvolumeclaims]
    verbs: [get, list]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "opsscript-agent.inventoryRoleName" $root }}
  namespace: {{ . }}
  labels:
    {{- include "opsscript-agent.labels" $root | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "opsscript-agent.serviceAccountName" $root }}
    namespace: {{ $root.Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "opsscript-agent.inventoryRoleName" $root }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
{{- if and .Values.rbac.create .Values.inventory.clusterWide }}
---
# Workload/PVC inventory: cluster-wide read access, equivalent to the
# per-namespace Role above but ignoring the inventory.namespaces allowlist
# (inventory.clusterWide opt-in). `pods` is already granted cluster-wide by
# the base ClusterRole above. Never grants access to Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "opsscript-agent.inventoryClusterRoleName" . }}
  labels:
    {{- include "opsscript-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "opsscript-agent.inventoryClusterRoleName" . }}
  labels:
    {{- include "opsscript-agent.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "opsscript-agent.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "opsscript-agent.inventoryClusterRoleName" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}

{{- if and .Values.rbac.create .Values.mcp.enabled .Values.mcp.secretRefs }}
{{- $root := . }}
{{/* Agrupa os Secrets por namespace: um Role por namespace, com todos os
     nomes daquele namespace em resourceNames. Sprig nao tem groupBy. */}}
{{- $byNamespace := dict }}
{{- range .Values.mcp.secretRefs }}
{{- $ns := .namespace | default $root.Release.Namespace }}
{{- $names := index $byNamespace $ns | default list }}
{{- $_ := set $byNamespace $ns (append $names .name) }}
{{- end }}
{{- range $ns, $names := $byNamespace }}
---
# MCP via agent: read access to the SPECIFIC Secrets holding MCP tokens.
#
# This is the only Secret access the agent ever gets, and it is as narrow
# as Kubernetes allows: a Role (never a ClusterRole), in one namespace,
# verb `get` only (no list/watch — which would expose every Secret in the
# namespace), and resourceNames restricted to the exact Secrets listed in
# mcp.secretRefs. The values are used as an auth header for the in-cluster
# MCP server and are never sent to OpsScript.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "opsscript-agent.mcpSecretRoleName" $root }}
  namespace: {{ $ns }}
  labels:
    {{- include "opsscript-agent.labels" $root | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames:
      {{- range ($names | uniq | sortAlpha) }}
      - {{ . }}
      {{- end }}
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "opsscript-agent.mcpSecretRoleName" $root }}
  namespace: {{ $ns }}
  labels:
    {{- include "opsscript-agent.labels" $root | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "opsscript-agent.serviceAccountName" $root }}
    namespace: {{ $root.Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "opsscript-agent.mcpSecretRoleName" $root }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
