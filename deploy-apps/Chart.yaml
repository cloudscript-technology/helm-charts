apiVersion: v2
name: deploy-apps
description: Helm chart flexível para deploy de múltiplas aplicações (Deployment, StatefulSet, CronJob, Job) com suporte a External Secrets e KEDA
type: application
version: 0.4.0
appVersion: "0.4.0"
kubeVersion: ">= 1.27.0-0"
home: https://cloudscript.com.br
icon: https://charts.cloudscript.com.br/helm-charts/deploy-apps/logo.png
keywords:
  - kubernetes
  - helm
  - multi-app
  - deployment
  - statefulset
  - cronjob
  - job
  - external-secrets
  - keda
  - autoscaling
  - pdb
  - cloudscript
maintainers:
  - name: Jonathan Schmitt
    email: jonathan.schmitt@cloudscript.com.br
dependencies: []
annotations:
  artifacthub.io/changes: |
    - kind: fixed
      description: serviceAccount.automount false (global and per app) is now rendered on the ServiceAccount and on the pods using it; previously the field was omitted and Kubernetes mounted the token anyway
    - kind: added
      description: serviceAccount.nameFromRelease names generated ServiceAccounts after the release (<release>, <release>-<app>) instead of the fullname
    - kind: added
      description: apps[].automountServiceAccountToken sets the token mount on the pod spec of an app
  artifacthub.io/displayName: "Deploy Apps"
  artifacthub.io/license: "Apache-2.0"
  artifacthub.io/provider: "Cloudscript"
  artifacthub.io/links: |
    - name: Cloudscript
      url: https://cloudscript.com.br
    - name: Documentation
      url: https://github.com/cloudscript-technology/helm-charts/tree/main/deploy-apps
